name: deploy-ce

on:
  workflow_dispatch:
    inputs:
      run_job:
        description: Optional job name to run after deploy (e.g. de_assessment_bronze_bootstrap)
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy assessment jobs to CE
    runs-on: ubuntu-latest
    environment: ce-assessment
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@v1

      # Secrets go through env rather than being interpolated into the script
      # body, so they are never expanded onto the shell command line.
      - name: Configure CLI profile
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          umask 077
          printf '[de-assessment-ce]\nhost = %s\ntoken = %s\n' \
            "$DATABRICKS_HOST" "$DATABRICKS_TOKEN" > "$HOME/.databrickscfg"

      # Uploads job sources to the workspace and upserts every assessment job
      # through the Jobs API — the same script used locally, so CI and laptop
      # deploys cannot drift.
      - name: Deploy assessment jobs
        run: bash scripts/deploy-all-ce-jobs.sh

      - name: Run job (optional)
        if: inputs.run_job != ''
        env:
          RUN_JOB: ${{ inputs.run_job }}
        run: |
          set -euo pipefail
          job_id="$(databricks jobs list --profile de-assessment-ce -o json | python3 -c "import json,os,sys;n=os.environ['RUN_JOB'];print(next(j['job_id'] for j in json.load(sys.stdin) if j['settings']['name']==n))")"
          databricks jobs run-now "$job_id" --profile de-assessment-ce
