[project]
name = "bronze-layer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bronze"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "unit: pure Python tests",
  "spark: local Spark tests",
]
