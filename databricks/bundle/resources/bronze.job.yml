resources:
  jobs:
    job_bronze_bootstrap:
      name: de_assessment_bronze_bootstrap
      max_concurrent_runs: 1
      tasks:
        - task_key: bootstrap
          spark_python_task:
            python_file: ../../jobs/bronze/src/bootstrap_bronze.py
            parameters: ["--catalog", "${var.catalog}"]

    job_bronze_ingest_products:
      name: de_assessment_bronze_products
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: ingest_products
          spark_python_task:
            python_file: ../../jobs/bronze/src/ingest_products.py
            parameters: ["--catalog", "${var.catalog}"]

    job_bronze_ingest_customers:
      name: de_assessment_bronze_customers
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: ingest_customers
          spark_python_task:
            python_file: ../../jobs/bronze/src/ingest_customers.py
            parameters: ["--catalog", "${var.catalog}"]

    job_bronze_ingest_orders:
      name: de_assessment_bronze_orders
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: ingest_orders
          spark_python_task:
            python_file: ../../jobs/bronze/src/ingest_orders.py
            parameters: ["--catalog", "${var.catalog}"]

    job_bronze_ingest_all:
      name: de_assessment_bronze_ingest_all
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_all
          spark_python_task:
            python_file: ../../jobs/bronze/src/ingest_all.py
            parameters: ["--catalog", "${var.catalog}"]
