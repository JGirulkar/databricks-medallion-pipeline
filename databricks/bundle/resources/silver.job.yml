resources:
  jobs:
    job_silver_bootstrap:
      name: de_assessment_silver_bootstrap
      max_concurrent_runs: 1
      tasks:
        - task_key: bootstrap
          spark_python_task:
            python_file: ../../jobs/silver/src/bootstrap_silver.py
            parameters: ["--catalog", "${var.catalog}"]

    job_silver_conform_all:
      name: de_assessment_silver_conform_all
      max_concurrent_runs: 1
      tasks:
        - task_key: conform_all
          spark_python_task:
            python_file: ../../jobs/silver/src/conform_all.py
            parameters: ["--catalog", "${var.catalog}"]
      trigger:
        pause_status: PAUSED
        table_update:
          table_names:
            - ${var.catalog}.bronze.products
            - ${var.catalog}.bronze.customers
            - ${var.catalog}.bronze.orders
          condition: ANY_UPDATED
