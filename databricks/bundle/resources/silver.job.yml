resources:
  jobs:
    job_silver_bootstrap:
      name: de_assessment_silver_bootstrap
      max_concurrent_runs: 1
      tasks:
        - task_key: bootstrap
          spark_python_task:
            python_file: ../../jobs/silver/src/bootstrap_silver.py
            parameters: ["--catalog", "${var.catalog}"]

    job_silver_conform_products:
      name: de_assessment_silver_conform_products
      max_concurrent_runs: 1
      tasks:
        - task_key: conform_products
          spark_python_task:
            python_file: ../../jobs/silver/src/conform_products.py
            parameters: ["--catalog", "${var.catalog}"]
      trigger:
        pause_status: PAUSED
        table_update:
          table_names:
            - ${var.catalog}.bronze.products

    job_silver_conform_customers:
      name: de_assessment_silver_conform_customers
      max_concurrent_runs: 1
      tasks:
        - task_key: conform_customers
          spark_python_task:
            python_file: ../../jobs/silver/src/conform_customers.py
            parameters: ["--catalog", "${var.catalog}"]
      trigger:
        pause_status: PAUSED
        table_update:
          table_names:
            - ${var.catalog}.bronze.customers

    job_silver_conform_orders:
      name: de_assessment_silver_conform_orders
      max_concurrent_runs: 1
      tasks:
        - task_key: conform_orders
          spark_python_task:
            python_file: ../../jobs/silver/src/conform_orders.py
            parameters: ["--catalog", "${var.catalog}"]
      trigger:
        pause_status: PAUSED
        table_update:
          table_names:
            - ${var.catalog}.bronze.orders
          min_time_between_triggers_seconds: 60
