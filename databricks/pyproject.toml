[project]
name = "de-medallion-databricks"
version = "0.1.0"
description = "DE C1 Assessment medallion pipeline workspace"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["jobs/data_generation", "jobs/bronze"]

[dependency-groups]
spark = [
  "pyspark>=3.5.0",
  "delta-spark>=3.2.0",
  "pytest>=8.0",
  "pytest-spark>=0.6",
  "faker>=24.0",
  "pandas>=2.0",
]
dev = ["ruff>=0.4"]
cluster = []  # databricks-connect — never install by default (breaks local Spark)

[tool.pytest.ini_options]
markers = [
  "unit: pure Python tests",
  "spark: local Spark tests",
  "cluster: CE cluster tests",
]

[tool.ruff.lint.per-file-ignores]
"jobs/bronze/src/bootstrap_bronze.py" = ["E402"]
"jobs/bronze/src/ingest_all.py" = ["E402"]
"jobs/bronze/src/ingest_customers.py" = ["E402"]
"jobs/bronze/src/ingest_orders.py" = ["E402"]
"jobs/bronze/src/ingest_products.py" = ["E402"]
"jobs/data_generation/src/generate_sample_data.py" = ["E402"]
"jobs/bronze/src/root_cause_analysis.py" = ["BLE001"]
